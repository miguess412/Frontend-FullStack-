<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <!-- Selector de Idioma Flotante Superior -->
            <div class="d-flex justify-content-end mb-2">
                <app-language-selector></app-language-selector>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-wifi me-2"></i>
                        {{ 'COMMON.APP_NAME' | translate }}
                    </h4>
                    <small class="text-white-50">{{ 'LOGIN.SUBTITLE' | translate }}</small>
                </div>
                <div class="card-body p-4">
                    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">{{ 'LOGIN.EMAIL' | translate }}</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input 
                                    type="email" 
                                    class="form-control" 
                                    id="email"
                                    name="email"
                                    [(ngModel)]="credentials.email"
                                    required
                                    email
                                    #email="ngModel"
                                    placeholder="admin@isp.com">
                            </div>
                            <div *ngIf="email.invalid && email.touched" class="text-danger small mt-1">
                                <i class="bi bi-exclamation-circle"></i>
                                Ingresa un correo válido
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">{{ 'LOGIN.PASSWORD' | translate }}</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="password"
                                    name="password"
                                    [(ngModel)]="credentials.password"
                                    required
                                    minlength="6"
                                    #password="ngModel"
                                    placeholder="••••••">
                            </div>
                            <div *ngIf="password.invalid && password.touched" class="text-danger small mt-1">
                                <i class="bi bi-exclamation-circle"></i>
                                La contraseña debe tener al menos 6 caracteres
                            </div>
                        </div>

                        <div *ngIf="errorMessage" class="alert alert-danger mt-3 shadow-sm py-2">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            {{ errorMessage }}
                        </div>

                        <button 
                            type="submit" 
                            class="btn btn-primary w-100 py-2 fw-semibold mt-2 shadow-sm"
                            [disabled]="loginForm.invalid || loading">
                            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                            <i *ngIf="!loading" class="bi bi-box-arrow-in-right me-2"></i>
                            {{ loading ? ('LOGIN.LOGGING_IN' | translate) : ('LOGIN.SIGN_IN' | translate) }}
                        </button>
                    </form>
                </div>
                <div class="card-footer text-center text-muted small bg-light py-2">
                    © 2026 ISP-Manager
                </div>
            </div>
        </div>
    </div>
</div>
